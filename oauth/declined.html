<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>eBay connection cancelled</title><style>body{margin:0;background:#fff;color:#17202a;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:680px;margin:12vh auto;padding:32px}h1{font-size:2rem}button{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid #17202a;background:#17202a;color:#fff;cursor:pointer}.muted{color:#5d6772}</style></head><body><main><h1>eBay connection cancelled</h1><p>No eBay permission was granted. You can return to Klera and try again whenever you're ready.</p><p><button id="open" type="button">Return to Klera</button></p><p class="muted">If Klera does not open automatically, make sure the app is running and use the button above.</p></main><script>(()=>{const p=new URLSearchParams(location.search);const out=new URLSearchParams();const state=p.get('state');if(state!==null)out.set('state',state);const target='klera://oauth/ebay/declined'+(out.toString()?'?'+out.toString():'');const open=()=>{location.href=target};document.getElementById('open').addEventListener('click',open);setTimeout(open,150)})();</script></body></html>
